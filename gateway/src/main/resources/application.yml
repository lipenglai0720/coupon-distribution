server:
  address: 127.0.0.1
  port: ${APP_PORT:8090}
spring:
  application:
    name: quanshu-gateway
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health,info
